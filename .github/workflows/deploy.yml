name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t calculator-app .

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Stop and remove old container
        run: docker rm -f calculator-app || true
      - name: Build and run new container
        run: docker run -d --name calculator-app -p 5000:5000 calculator-app

  test:
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Wait for container
        run: sleep 10
      - name: Test port availability
        run: curl -f http://localhost:5000 || exit 1
      - name: Check container is running
        run: docker ps | grep calculator-app
