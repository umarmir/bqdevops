<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Calculator Web App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result-container {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 5px;
            display: none;
        }
        
        .result-container.show {
            display: block;
        }
        
        .result-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .result-value {
            font-size: 28px;
            color: #667eea;
            font-weight: bold;
        }
        
        .error {
            color: #e74c3c;
            padding: 12px;
            background: #fadbd8;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 Calculator</h1>
        
        <form id="calculatorForm">
            <div class="form-group">
                <label for="valueA">First Value (a)</label>
                <input type="number" id="valueA" placeholder="Enter first value" step="any" required>
            </div>
            
            <div class="form-group">
                <label for="operation">Operation</label>
                <select id="operation" required>
                    <option value="">-- Select Operation --</option>
                    <option value="add">Add (+)</option>
                    <option value="subtract">Subtract (-)</option>
                    <option value="multiply">Multiply (×)</option>
                    <option value="divide">Divide (÷)</option>
                    <option value="power">Power (^)</option>
                    <option value="modulo">Modulo (%)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="valueB">Second Value (b)</label>
                <input type="number" id="valueB" placeholder="Enter second value" step="any" required>
            </div>
            
            <button type="submit">Calculate</button>
        </form>
        
        <div class="result-container" id="resultContainer">
            <div class="result-label">Result:</div>
            <div class="result-value" id="resultValue"></div>
        </div>
        
        <div class="error" id="errorMessage"></div>
    </div>
    
    <script>
        document.getElementById('calculatorForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const a = parseFloat(document.getElementById('valueA').value);
            const b = parseFloat(document.getElementById('valueB').value);
            const operation = document.getElementById('operation').value;
            
            const resultContainer = document.getElementById('resultContainer');
            const errorMessage = document.getElementById('errorMessage');
            
            resultContainer.classList.remove('show');
            errorMessage.classList.remove('show');
            
            try {
                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ a, b, operation })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('resultValue').textContent = data.result;
                    resultContainer.classList.add('show');
                } else {
                    errorMessage.textContent = data.error;
                    errorMessage.classList.add('show');
                }
            } catch (error) {
                errorMessage.textContent = 'An error occurred: ' + error.message;
                errorMessage.classList.add('show');
            }
        });
    </script>
</body>
</html>
